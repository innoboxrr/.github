name: Node release

# Publicación de un paquete npm del ecosistema.
#
# La versión vive en package.json y en ningún otro sitio: el tag se deriva de
# ella. Al revés —autoincrementar un tag y esperar que package.json coincida—
# es como se acaba publicando 2.0.0 con un package.json que dice 1.9.7.
#
# Se publica con **trusted publishing** (OIDC): npm confía en este repositorio
# y en este workflow, y no hace falta ningún token. Antes se pasaba un
# NODE_AUTH_TOKEN, y ahí estaba el problema: cuando npm ve un token se
# autentica con él **en vez de** usar el intercambio OIDC, así que la
# publicación acababa pidiendo un código de dos factores que en CI no hay
# quien teclee. La provenance se firmaba bien y el publish fallaba justo
# después.
#
# Requisitos, una vez por paquete:
#   - En npmjs.com → paquete → Settings → Trusted Publisher: GitHub Actions,
#     con este repositorio y `release.yml`, y el permiso `npm publish`.
#   - `permissions: id-token: write` (ya está más abajo).
#
# Uso desde un paquete:
#
#     jobs:
#         release:
#             uses: innoboxrr/.github/.github/workflows/node-release.yml@main

on:
    workflow_call:
        inputs:
            working-directory:
                type: string
                default: '.'

jobs:
    release:
        runs-on: ubuntu-latest

        if: >
            github.event_name == 'workflow_dispatch' ||
            github.event.workflow_run.conclusion == 'success'

        permissions:
            contents: write
            # El identificador que npm intercambia por el permiso de publicar.
            # Sin esto no hay trusted publishing.
            id-token: write

        defaults:
            run:
                working-directory: ${{ inputs.working-directory }}

        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.ref }}
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '22'
                  registry-url: 'https://registry.npmjs.org'

            # El npm que trae Node 22 es anterior al soporte de OIDC. Sin esta
            # línea el publish intenta autenticarse a la antigua y pide OTP.
            - name: Actualizar npm
              run: npm install -g npm@latest

            - name: Leer la versión
              id: version
              run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: ¿Hay que publicar?
              id: check
              run: |
                  if git rev-parse "v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
                      echo "::notice::El tag v${{ steps.version.outputs.value }} ya existe; no se publica."
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Instalar
              if: steps.check.outputs.skip != 'true'
              run: npm install --no-audit --no-fund

            - name: Tests
              if: steps.check.outputs.skip != 'true'
              run: npm test

            # Sin NODE_AUTH_TOKEN a propósito: es lo que deja que npm use el
            # intercambio OIDC en vez de un token.
            - name: Publicar en npm
              if: steps.check.outputs.skip != 'true'
              run: npm publish --provenance --access public

            - name: Etiquetar
              if: steps.check.outputs.skip != 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "v${{ steps.version.outputs.value }}"
                  git push origin "v${{ steps.version.outputs.value }}"
