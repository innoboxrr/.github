name: PHP tests

# Definición única de cómo se prueba un paquete Composer del ecosistema.
#
# Además de la suite corre `larapack:audit`, que comprueba que el paquete
# declare las versiones de la línea base. Ese paso es el que impide que la
# alineación se deshaga: sin él, un composer.json puede volver a quedarse sin
# restricción de PHP y nadie se entera hasta que algo revienta en producción.
#
# Uso desde un paquete:
#
#     jobs:
#         tests:
#             uses: innoboxrr/.github/.github/workflows/php-tests.yml@main

on:
    workflow_call:
        inputs:
            php-versions:
                description: 'Versiones de PHP a probar, como array JSON'
                type: string
                default: '["8.3", "8.4"]'
            audit:
                description: 'Ejecutar larapack:audit contra el paquete'
                type: boolean
                default: true
            extensions:
                description: 'Extensiones de PHP adicionales, separadas por coma'
                type: string
                default: ''
            tests-required:
                description: 'Fallar si el paquete no tiene una suite ejecutable. En false, un paquete sin tests pasa con solo instalar y compilar.'
                type: boolean
                default: true

jobs:
    tests:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ${{ fromJSON(inputs.php-versions) }}

        name: PHP ${{ matrix.php }}

        steps:
            - uses: actions/checkout@v5

            - name: Preparar PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: ${{ inputs.extensions }}
                  coverage: none

            # `update` y no `install`: son librerías y no versionan el
            # lockfile, así que la suite corre contra lo que de verdad va a
            # resolver quien las instale.
            - name: Instalar dependencias
              run: composer update --prefer-dist --no-interaction --no-progress

            # Lo mínimo que tiene que cumplir cualquier paquete, tenga tests o
            # no: que su código compile en cada PHP de la matriz. Es la puerta
            # que les queda a los paquetes que todavía no tienen suite; sin
            # ella, un push con un error de sintaxis se publicaba igual.
            - name: Sintaxis
              run: |
                  if [ -d src ]; then
                      find src -name '*.php' -print0 | while IFS= read -r -d '' file; do
                          php -l "$file" > /dev/null || { php -l "$file"; exit 1; }
                      done
                  fi

            # `|| true` porque grep sale con 1 cuando no encuentra nada, y que
            # el informe tumbe la matriz sería absurdo.
            # composer show admite un paquete por llamada; con varios fallaba y
            # dejaba un error en el log que no era de nadie.
            - name: Versiones resueltas
              run: |
                  for package in illuminate/support phpunit/phpunit; do
                      composer show "$package" 2>/dev/null | grep -E "^(name|versions)" || true
                  done

            - name: Auditar contra la línea base del ecosistema
              if: inputs.audit
              run: |
                  # Se comprueba el comando y no sólo el binario: un paquete que
                  # todavía pide larapack-generator ^5 instala un builder sin
                  # audit, que además no carga su autoloader dentro de vendor/.
                  if [ -f vendor/innoboxrr/larapack-generator/src/Commands/AuditCommand.php ]; then
                      php vendor/innoboxrr/larapack-generator/builder larapack:audit .
                  elif [ -f vendor/innoboxrr/larapack-generator/builder ]; then
                      echo "::warning::El paquete instala una versión de larapack-generator anterior a la 7, sin larapack:audit; no se audita."
                  elif [ -f builder ]; then
                      php builder larapack:audit .
                  else
                      echo "::warning::larapack-generator no está instalado; no se audita."
                  fi

            # Sin suite, `tests-required` decide. Por omisión falla: un
            # paquete que dice tener tests y no los tiene es un error. En false
            # pasa avisando, para que un paquete sin tests pueda tener al menos
            # la puerta de instalar y compilar.
            - name: Tests
              run: |
                  config=""
                  [ -f phpunit.xml.dist ] && config=phpunit.xml.dist
                  [ -f phpunit.xml ] && config=phpunit.xml

                  if [ -f vendor/bin/phpunit ] && [ -n "$config" ] && find tests -name '*Test.php' 2>/dev/null | grep -q .; then
                      vendor/bin/phpunit
                  elif [ "${{ inputs.tests-required }}" = "true" ]; then
                      echo "::error::No hay suite ejecutable: hace falta phpunit, su configuración y al menos un *Test.php."
                      exit 1
                  else
                      echo "::warning::Sin suite: solo se comprobó que el paquete instala y compila."
                  fi
